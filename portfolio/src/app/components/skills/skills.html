<section id="skills" class="section section--surface">
  <div class="container">
    <div class="section-heading">
      <p class="eyebrow">02 / Technical skills</p>
      <h2>Tools I work with.</h2>
    </div>

    <div class="skills-grid">
      @for (skill of skills; track skill.name) {
        <article class="skill-card">
          <span class="skill-mark">
            @if (isIconAvailable(skill.name)) {
              <img
                [src]="iconUrl(skill.icon)"
                [alt]="skill.name + ' icon'"
                (error)="markIconUnavailable(skill.name)"
              >
            } @else {
              <span aria-hidden="true">{{ skill.name.slice(0, 1) }}</span>
            }
          </span>
          <div>
            <h3>{{ skill.name }}</h3>
            <p>{{ skill.category }}</p>
          </div>
        </article>
      }
    </div>
  </div>
</section>
