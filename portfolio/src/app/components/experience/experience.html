<section id="experience" class="section section--surface">
  <div class="container">
    <div class="section-heading">
      <p class="eyebrow">05 / Experience</p>
      <h2>Where I’ve contributed.</h2>
    </div>

    <div class="timeline">
      @for (experience of experiences; track experience.company) {
        <article class="timeline-entry">
          <div class="timeline-dot" aria-hidden="true"></div>
          <div class="timeline-card">
            <p class="date">{{ experience.date }}</p>
            <h3>{{ experience.role }}</h3>
            <p class="company">{{ experience.company }}</p>
            <ul>
              @for (responsibility of experience.responsibilities; track responsibility) {
                <li>{{ responsibility }}</li>
              }
            </ul>
          </div>
        </article>
      }
    </div>
  </div>
</section>
