<section id="home" class="hero container">

  <div class="hero-copy">

    <p class="eyebrow">Hello, I’m</p>

    <h1>
      Harold Nikko<br>
      <span>Salanguit</span>
    </h1>

    <p class="hero-title">
      Software Engineer building reliable web applications
    </p>

    <p class="lead">
     I build practical, user-focused digital solutions that turn ideas into meaningful and reliable experiences.
    </p>

    <p class="availability">
      <span aria-hidden="true"></span>
      Open to opportunities
    </p>

    <div class="actions">

      <a
        class="button button--primary"
        href="#projects"
      >
        View My Projects
        <span>→</span>
      </a>

      <a
        class="button button--secondary"
        [href]="links.resume"
        download
      >
        Download Resume
      </a>

    </div>

    <div
      class="socials"
      aria-label="Social links"
    >

      <a
        [href]="links.github"
        aria-label="GitHub"
        target="_blank"
        rel="noopener noreferrer"
      >
        <svg
          viewBox="0 0 24 24"
          aria-hidden="true"
        >
          <path
            d="M12 2a10 10 0 0 0-3.16 19.49c.5.09.68-.22.68-.48v-1.7c-2.78.6-3.37-1.18-3.37-1.18-.45-1.16-1.11-1.47-1.11-1.47-.91-.62.07-.61.07-.61 1 .07 1.54 1.04 1.54 1.04.9 1.53 2.35 1.09 2.92.83.09-.65.35-1.09.63-1.34-2.22-.25-4.56-1.11-4.56-4.95 0-1.1.4-2 1.03-2.71-.1-.25-.45-1.28.1-2.67 0 0 .84-.27 2.75 1.03A9.5 9.5 0 0 1 12 6.8c.85 0 1.7.11 2.5.33 1.91-1.3 2.75-1.03 2.75-1.03.55 1.39.2 2.42.1 2.67.64.71 1.03 1.61 1.03 2.71 0 3.85-2.34 4.7-4.57 4.95.36.31.68.9.68 1.82v2.76c0 .26.18.57.69.48A10 10 0 0 0 12 2Z"
          />
        </svg>
      </a>

      <a
        [href]="links.linkedin"
        aria-label="LinkedIn"
        target="_blank"
        rel="noopener noreferrer"
      >
        <svg
          viewBox="0 0 24 24"
          aria-hidden="true"
        >
          <path
            d="M6.5 8.5A1.5 1.5 0 1 0 6.5 5a1.5 1.5 0 0 0 0 3.5ZM5.2 9.7h2.6V18H5.2V9.7Zm4.2 0h2.5v1.13h.04c.35-.66 1.2-1.36 2.47-1.36 2.64 0 3.13 1.74 3.13 4V18h-2.6v-4c0-.95-.02-2.18-1.33-2.18-1.33 0-1.54 1.04-1.54 2.11V18H9.4V9.7Z"
          />
        </svg>
      </a>

      <a
        [href]="links.email"
        aria-label="Email Harold"
      >
        <svg
          viewBox="0 0 24 24"
          aria-hidden="true"
        >
          <path
            d="M3.5 5.5h17c.83 0 1.5.67 1.5 1.5v10c0 .83-.67 1.5-1.5 1.5h-17A1.5 1.5 0 0 1 2 17V7c0-.83.67-1.5 1.5-1.5Zm0 2v.22l8.5 5.34 8.5-5.34V7.5h-17Zm17 8.18-8.5 5.34-8.5-5.34V17h17v-1.32Z"
          />
        </svg>
      </a>

    </div>

  </div>

  <!-- LAPTOP IMAGE -->
  <div class="laptop-visual">

    <img
      src="/laptop.png"
      alt="Portfolio website displayed on a laptop"
      class="laptop-image"
    />

  </div>

</section>
