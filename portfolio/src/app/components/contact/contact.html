<section id="contact" class="section container">
  <div class="contact-card">
    <p class="eyebrow">05 / Contact</p>
    <h2>Let’s work together.</h2>
    <p>
      I’m open to exciting opportunities, collaborations, and interesting projects.
    </p>
    <div class="contact-actions">
      <a class="button button--primary" [href]="'mailto:' + email">
        Get In Touch <span>→</span>
      </a>
      <a class="contact-detail" [href]="'mailto:' + email">
        {{ email }}
      </a>
      <a class="contact-detail" [href]="'tel:' + phone">
        {{ phone }}
      </a>
    </div>
  </div>
</section>
