<header class="site-header">
  <nav class="nav container" aria-label="Primary navigation">
    <a class="brand" href="#home" (click)="closeMenu()">
      <img src="LOGO-NAME.png" alt="" aria-hidden="true">
      <span class="brand-name">Harold Nikko G. Salanguit</span>
    </a>

    <div class="nav-links" [class.open]="menuOpen">
      <a href="#home" (click)="closeMenu()">Home</a>
      <a href="#about" (click)="closeMenu()">About</a>
      <a href="#skills" (click)="closeMenu()">Skills</a>
      <a href="#projects" (click)="closeMenu()">Projects</a>
      <a href="#experience" (click)="closeMenu()">Experience</a>
      <a href="#contact" (click)="closeMenu()">Contact</a>
    </div>

    <div class="nav-controls">
      <button
        class="theme-toggle"
        type="button"
        (click)="themeService.toggleTheme()"
        [attr.aria-label]="themeService.theme() === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'"
        [attr.aria-pressed]="themeService.theme() === 'dark'"
        [attr.title]="themeService.theme() === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'"
      >
        @if (themeService.theme() === 'dark') {
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4V2m0 20v-2m8-8h2M2 12h2m13.66-5.66 1.42-1.42M4.92 19.08l1.42-1.42m12.32 1.42-1.42-1.42M4.92 4.92l1.42 1.42M16 12a4 4 0 1 1-8 0 4 4 0 0 1 8 0Z"/></svg>
        } @else {
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.6 15.3A8.5 8.5 0 0 1 8.7 3.4 8.5 8.5 0 1 0 20.6 15.3Z"/></svg>
        }
        <span class="theme-toggle__label">{{ themeService.theme() === 'dark' ? 'Light' : 'Dark' }}</span>
      </button>

      <button class="menu-toggle" type="button" (click)="toggleMenu()" [attr.aria-expanded]="menuOpen" aria-label="Toggle navigation">
        <span></span><span></span><span></span>
      </button>
    </div>
  </nav>
</header>
